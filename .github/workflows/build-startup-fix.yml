name: Neo Racing Android crash fix build
on:
  workflow_dispatch:
  push:
    branches: ["fix/diagnose-build-7-startup"]
    paths:
      - ".github/workflows/build-startup-fix.yml"
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/diagnose-build-7-startup
      - name: Extract Android project
        run: |
          set -e
          unzip -q NeoRacing3000-Android-Professional-1.2.0.zip -d work
          cd work/NeoRacing3000-AndroidGamepad
          python3 - <<'PY'
          from pathlib import Path
          p=Path("app/src/main/java/com/neo/racing/MainActivity.java")
          s=p.read_text()
          start=s.index("    private void hideSystemBars() {")
          end=s.index("\n    @Override protected void onCreate", start)
          replacement="""    private void hideSystemBars() {
                android.view.Window window = getWindow();
                if (window == null) return;
                View decor = window.getDecorView();
                if (decor == null) return;
                final int flags = View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                        | View.SYSTEM_UI_FLAG_FULLSCREEN
                        | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                        | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                        | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
                        | View.SYSTEM_UI_FLAG_LAYOUT_STABLE;
                decor.setSystemUiVisibility(flags);
            }
"""
          s=s[:start]+replacement+s[end:]
          s=s.replace("        hideSystemBars();\n        getWindow().getDecorView().setOnSystemUiVisibilityChangeListener", "        getWindow().getDecorView().setOnSystemUiVisibilityChangeListener")
          s=s.replace("        setContentView(webView);\n        webView.loadUrl", "        setContentView(webView);\n        getWindow().getDecorView().post(this::hideSystemBars);\n        webView.loadUrl")
          s=s.replace("    @Override protected void onResume() { super.onResume(); hideSystemBars(); if (webView != null) webView.onResume(); }", "    @Override protected void onResume() { super.onResume(); if (webView != null) webView.onResume(); View decor = getWindow() != null ? getWindow().getDecorView() : null; if (decor != null) decor.post(this::hideSystemBars); }")
          s=s.replace("        if (hasFocus) hideSystemBars();", "        if (hasFocus) { View decor = getWindow() != null ? getWindow().getDecorView() : null; if (decor != null) decor.post(this::hideSystemBars); }")
          p.write_text(s)
          PY
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
          mkdir -p ../../output
          cp app/build/outputs/apk/debug/app-debug.apk ../../output/NeoRacing3000-startup-fix-debug.apk
          sha256sum ../../output/*.apk | tee ../../output/SHA256SUMS.txt
      - name: Upload corrected APK candidate
        uses: actions/upload-artifact@v4
        with:
          name: neo-racing-startup-fix-apk-candidate
          path: output/
          if-no-files-found: error
          retention-days: 14
